# Deploys the child theme to test.delicja.dk on every push to main.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      server hostname or IP
#   DEPLOY_PORT      SSH port (optional, default 22)
#   DEPLOY_USER      SSH user that owns the WordPress files
#   DEPLOY_SSH_KEY   private key whose public half is in the user's ~/.ssh/authorized_keys
#   DEPLOY_PATH      absolute path of the theme folder, must end with /wp-content/themes/delicja-child

name: Deploy to test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the settings
        env:
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          RAW_PORT: ${{ secrets.DEPLOY_PORT }}
          RAW_USER: ${{ secrets.DEPLOY_USER }}
          RAW_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Secrets pasted from a browser often carry spaces or line breaks; strip them.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          DEPLOY_HOST="$(clean "$RAW_HOST" | sed -e 's#^[a-z]*://##' -e 's#/.*$##')"
          DEPLOY_PORT="$(clean "$RAW_PORT")"
          DEPLOY_USER="$(clean "$RAW_USER")"
          DEPLOY_PATH="$(clean "$RAW_PATH" | sed -e 's#/*$##')"
          [ -n "$DEPLOY_PORT" ] || DEPLOY_PORT=22

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "The $name secret is missing or empty" >&2
              exit 1
            fi
          done

          # rsync --delete runs against this folder, so refuse anything that is not the theme folder.
          case "$DEPLOY_PATH" in
            */wp-content/themes/delicja-child) ;;
            *) echo "DEPLOY_PATH must end with /wp-content/themes/delicja-child" >&2; exit 1 ;;
          esac

          {
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_PORT=$DEPLOY_PORT"
            echo "DEPLOY_USER=$DEPLOY_USER"
            echo "DEPLOY_PATH=$DEPLOY_PATH"
          } >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -l $DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Check the server
        run: |
          # Fail early, with a hint, if rsync is missing or the themes folder is not where we expect it.
          THEMES_DIR="$(dirname "$DEPLOY_PATH")"
          $SSH_CMD "$DEPLOY_HOST" "
            command -v rsync > /dev/null || { echo 'rsync is not installed on the server' >&2; exit 1; }
            if [ ! -d '$THEMES_DIR' ]; then
              echo 'Themes folder not found: $THEMES_DIR' >&2
              echo \"Home: \$(pwd)\" >&2
              ls -la >&2
              exit 1
            fi
          "

      - name: Upload the theme
        run: |
          # The theme clears the page cache once when this SHA changes (inc/deploy.php).
          echo "$GITHUB_SHA" > .deployed
          rsync -rlz --delete --chmod=D755,F644 \
            --exclude-from=.deployignore \
            -e "$SSH_CMD" \
            ./ "$DEPLOY_HOST:$DEPLOY_PATH/"
